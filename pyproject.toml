[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "fly-connectome"
version = "0.1.0"
description = "Fused fly connectome as a trainable neural network (FAFB + MANC + Optic Lobe)"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "networkx>=3.0",
    "requests>=2.28",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "neuprint-python>=0.4.25",
    "navis>=1.4",
    "fafbseg>=3.0",
]

[project.optional-dependencies]
dev = ["pytest", "ipython", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]
